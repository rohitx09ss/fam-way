<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <link rel="icon" href="/fpay-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="gateway-wrapper">
    <!-- Top Brand Header using First Image (17578.png) in compact size -->
    <div class="brand-header">
      <img class="brand-logo-img" src="/fpay-logo.png" alt="F PAY" style="height:36px;width:auto;display:block">
    </div>

    <!-- Amount Header -->
    <div class="amount-section">
      <div class="amount-label">Order Total</div>
      <div class="amount-value">
        ₹<span id="orderAmount">1.00</span>
        <span class="amount-currency">INR</span>
      </div>
    </div>

    <!-- Main White Card -->
    <div class="payment-card">

      <!-- State 1: Real Scannable QR Code with Small Second Image (17576.png) in Center -->
      <div class="qr-section" id="qrSection">
        <div class="qr-box">
          <div id="qrcode"><img id="qrImg" alt="UPI QR code" /></div>
</div>

        <div class="scan-hint">Scan with any UPI app</div>

        <button class="save-qr-btn" id="saveQr" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Save QR
        </button>
        <a class="upi-open" id="upiBtn" hidden>Open in UPI app</a>
      </div>

      <!-- State 2: Upgraded Animated Payment Successful View -->
      <div class="success-section" id="successSection">
        <div class="success-banner">
          <div class="checkmark-wrapper">
            <svg class="checkmark-svg" viewBox="0 0 52 52">
              <path class="checkmark-check" d="M14 27l8 8 16-16"/>
            </svg>
          </div>
          <div class="success-title">Payment Successful!</div>
          <div class="success-subtitle">₹<span id="paidAmountText">1.00</span> received by <span id="payeeName"></span></div>
          <div class="utr-chip">
            <span>UPI Ref:</span>
            <strong id="utrNumber">631684920145</strong>
          </div>
        </div>
      </div>

      <!-- Order Metadata Rows -->
      <div class="state-msg" id="stateMsg" hidden></div>

      <div class="details-list">
        <div class="detail-row">
          <span class="detail-label">Merchant</span>
          <span class="detail-value" id="merchantName">Ro Ro</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Order ID</span>
          <span class="detail-value" id="orderId">fp_QM4PRMIO</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Reference</span>
          <span class="detail-value mono" id="gatewayId">GW-FP-8484</span>
        </div>
        <div class="detail-row" id="expiryRow">
          <span class="detail-label">Expires In</span>
          <span class="detail-value" id="countdownTimer">Expires in 23:59:37</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Verification</span>
          <span class="status-pill" id="statusBadge">
            <span class="status-dot"></span>
            <span id="statusText">Waiting for payment...</span>
          </span>
        </div>
      </div>
    </div>

    <a class="support-link" id="supportLink" hidden target="_blank" rel="noopener">Need help? WhatsApp the merchant →</a>

    <!-- Footer -->
    <div class="gateway-footer">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span>Secured by <strong id="brandFoot"></strong></span>
    </div>
  </div>

  <!-- Demo Buttons (Remove in production) -->
  <script type="module" src="/src/pages/pay-1.js"></script>
</body>
</html>
